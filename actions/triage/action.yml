name: 'pr-goblin triage'
description: 'Claude-powered triage for pr-goblin issues — classifies, assesses severity, and drafts a proposed fix'
inputs:
  anthropic-api-key:
    description: 'Anthropic API key. Fallback when the workload identity federation inputs below are not set.'
    required: false
  anthropic-federation-rule-id:
    description: 'Workload identity federation rule ID (fdrl_...). Set together with the organisation and service account IDs, and grant the job id-token: write.'
    required: false
  anthropic-organization-id:
    description: 'Anthropic organisation ID (Console: Settings, Organization). Required with the federation rule ID.'
    required: false
  anthropic-service-account-id:
    description: 'Service account ID (svac_...) the federation rule targets. Required with the federation rule ID.'
    required: false
  anthropic-workspace-id:
    description: 'Workspace ID (wrkspc_...). Only needed when the federation rule covers more than one workspace.'
    required: false
  github-token:
    description: 'GitHub token with issues:write and actions:write'
    default: ${{ github.token }}
  model:
    description: 'Claude model ID'
    default: 'claude-sonnet-4-6'
  ntfy-topic:
    description: 'NTFY topic URL (e.g. https://ntfy.sh/your-topic). Leave empty to skip notifications.'
    required: false
  ntfy-token:
    description: 'Bearer token for authenticated self-hosted NTFY server. Leave empty for public topics.'
    required: false
  webhook-secret:
    description: 'Shared secret for the intake approve webhook. Same value as the Worker WEBHOOK_SECRET env var. Never sent over ntfy itself: it signs a short-lived, issue-scoped approval token instead, so it stays illegible to anyone who can merely read the ntfy topic.'
    required: false
  pr-goblin-worker-url:
    description: 'Base URL of your pr-goblin intake endpoint. Required for the 🟢 Approve button, which marks the issue trusted and ready for the runner.'
    required: false
runs:
  using: 'node20'
  main: 'dist/index.mjs'
