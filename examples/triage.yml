# Triage reports that arrive through the pr-goblin widget.
# Copy to .github/workflows/triage.yml in your repo. GitHub Issues only.
#

name: pr-goblin triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    runs-on: ubuntu-latest
    steps:
      - uses: Rumi-Shamz/pr-goblin/actions/triage@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: a push notification with an Approve button.
          # ntfy-topic: https://ntfy.sh/your-private-topic
          # webhook-secret: ${{ secrets.GOBLIN_WEBHOOK_SECRET }}
          # pr-goblin-worker-url: https://your-intake.example
