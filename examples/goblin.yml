# pr-goblin runner on a schedule. Copy to .github/workflows/goblin.yml in your repo.
#
# Each run polls once, works the tickets that are due, opens PRs, and exits.
# Nothing is kept between runs: progress lives on the ticket and the branch.
#

name: pr-goblin

on:
  schedule:
    - cron: '*/15 * * * *'   # GitHub's minimum is 5 minutes, and runs are often late
  workflow_dispatch:

# One run at a time, so two runs never pick up the same ticket.
concurrency:
  group: pr-goblin
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get pr-goblin
        uses: actions/checkout@v4
        with:
          repository: Rumi-Shamz/pr-goblin
          # v0 follows the latest 0.x release. Pin an exact release (v0.1.0) or a
          # commit SHA to upgrade only when you choose. Never use main: it would
          # run unreleased code with write access to your repo.
          ref: v0
          path: pr-goblin

      - uses: oven-sh/setup-bun@v2

      - name: Install the runner and the coding agent
        run: |
          cd pr-goblin/runner && bun install --frozen-lockfile
          npm install -g @anthropic-ai/claude-code

      - name: Git identity for the agent's commits
        run: |
          # Commit as the token's owner. A made-up noreply address such as
          # pr-goblin@users.noreply.github.com belongs to whichever GitHub account
          # has that login, and hosts like Vercel refuse to deploy commits by
          # authors outside the team. The built-in token has no user, so it
          # falls back to the github-actions bot.
          if owner=$(gh api user -q '"\(.id) \(.login)"' 2>/dev/null); then
            read -r id login <<<"$owner"
            git config --global user.name "$login"
            git config --global user.email "$id+$login@users.noreply.github.com"
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          gh auth setup-git
        env:
          GH_TOKEN: ${{ secrets.GOBLIN_GH_TOKEN || github.token }}

      - name: Work the queue
        run: bun pr-goblin/runner/src/cli/app.ts once --timeout 50
        env:
          # A token of your own makes the PRs trigger your CI; the built-in one does not.
          GH_TOKEN: ${{ secrets.GOBLIN_GH_TOKEN || github.token }}
          # Agent credentials: set ONE of these two secrets.
          #   ANTHROPIC_API_KEY        pay per use (Console API key)
          #   CLAUDE_CODE_OAUTH_TOKEN  your Claude Pro/Max subscription, from `claude setup-token`
          # When both are set the API key wins. A subscription has usage caps: when one
          # is hit, tickets stay queued and a later run picks them up after the reset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tracker: GitHub Issues on this repo by default. For Linear, set these three:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GOBLIN_LINEAR_TEAM: ${{ vars.GOBLIN_LINEAR_TEAM }}
          GOBLIN_LINEAR_PROJECT: ${{ vars.GOBLIN_LINEAR_PROJECT }}
