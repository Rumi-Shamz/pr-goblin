name = "pr-goblin-intake"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via: wrangler secret put NAME)
#
# Ticket target — GitHub Issues:
#   GITHUB_TOKEN      — fine-grained PAT: Issues read/write, Contents read/write (screenshots)
#   GITHUB_REPO       — "owner/repo"
# Ticket target — Linear (set both to create tickets in Linear instead):
#   LINEAR_API_KEY    — personal API key
#   LINEAR_TEAM_KEY   — team key, e.g. "ENG"
#   LINEAR_PROJECT    — optional project slug id
# Optional:
#   TRUST_SECRET      — shared with your app's backend to mark reports from testers as trusted
#   WEBHOOK_SECRET    — signs the Approve link (generate with: openssl rand -hex 16)

[vars]
# ALLOWED_ORIGIN controls the Access-Control-Allow-Origin response header.
# "*" is the open default — anyone can POST from any origin (fine for local dev,
# but before deploying to production change this to your actual domain so that
# browser-based submissions are restricted to your site:
#   ALLOWED_ORIGIN = "https://yourapp.com"
# Note: CORS headers only affect browser requests. Server-side or curl requests
# bypass CORS regardless, so this is not a substitute for rate limiting.
ALLOWED_ORIGIN = "*"
