# Release on a version tag: `git tag v0.2.0 && git push origin v0.2.0`.
#
# 1. Runs the tests.
# 2. Publishes a GitHub release with the built widget and intake files, so
#    people who copy them into their app can take a known version.
# 3. Publishes the widget to npm as pr-goblin-widget, at the tag's version.
#    No token: npm trusts this workflow through OIDC (trusted publishing,
#    configured on the package's settings page on npmjs.com).
# 4. Moves the major tag (v0, v1, …) to this release. The example workflows
#    reference that tag, so users on it get the release on their next run, and
#    users who pinned an exact tag or SHA are unaffected.
#
# Write the release notes under the version's heading in CHANGELOG.md first.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write # npm trusted publishing

# One run per tag, so a release waiting behind another is never cancelled.
# The major-tag step below is safe when two releases run at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the runner
        working-directory: runner
        run: bun install --frozen-lockfile && bunx tsc --noEmit && bun test src/

      - name: Test and build the widget
        working-directory: widget
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          pnpm install --frozen-lockfile && pnpm test && pnpm build

      - name: Test and build the intake
        working-directory: intake
        run: pnpm install --frozen-lockfile && pnpm test && pnpm typecheck && pnpm build:lib && pnpm build:node

      - name: Test the triage action
        working-directory: actions/triage
        run: pnpm install --frozen-lockfile && pnpm test

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp widget/dist/pr-goblin.iife.js "pr-goblin-widget-${GITHUB_REF_NAME}.iife.js"
          cp intake/dist/pr-goblin-intake.mjs "pr-goblin-intake-${GITHUB_REF_NAME}.mjs"
          cp intake/dist/node.mjs "pr-goblin-intake-node-${GITHUB_REF_NAME}.mjs"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            "pr-goblin-widget-${GITHUB_REF_NAME}.iife.js" \
            "pr-goblin-intake-${GITHUB_REF_NAME}.mjs" \
            "pr-goblin-intake-node-${GITHUB_REF_NAME}.mjs"

      - name: Publish the widget to npm
        working-directory: widget
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "pr-goblin-widget@$version" version 2>/dev/null)" ]; then
            echo "pr-goblin-widget@$version is already on npm; skipping"
            exit 0
          fi
          # Only the newest release becomes `latest`, so a maintenance release
          # (0.1.1 after 0.2.0) does not move `npm install` users backwards.
          git fetch --force --tags origin
          newest=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          dist_tag=latest
          [ "$newest" = "$GITHUB_REF_NAME" ] || dist_tag=maintenance
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@11.6.2
          npm publish --access public --provenance --tag "$dist_tag"

      - name: Move the major tag
        # Only when this is the newest release of its major version, so a later
        # maintenance release (v0.1.1 after v0.2.0) never moves v0 backwards.
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git fetch --force --tags origin
          newest=$(git tag -l "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is not the newest $major release ($newest); leaving $major where it is"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
